[package]
name = "hyprtilt"
description = "TUI and CLI for Hyprland monitor layout that edits your Lua or hyprlang config in place"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["hyprland", "monitor", "tui", "wayland"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
hyprtilt-core = { version = "0.1.0", path = "../hyprtilt-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

# Debian package (cargo-deb). The binary is static (musl), so the package
# has no dependencies and installs on older releases too. The man page and
# the completions are generated by "just assets" into dist/assets/.
[package.metadata.deb]
maintainer = "Mateusz Okulanis <FPGArtktic@outlook.com>"
copyright = "2026, Mateusz Okulanis <FPGArtktic@outlook.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
hyprtilt arranges Hyprland monitors from the terminal. It edits the \
monitor rules in your own Hyprland configuration file (Lua or hyprlang) \
in place, inside a managed block, verifies changes through Hyprland's IPC \
and rolls them back unless you confirm them."""
section = "utils"
priority = "optional"
depends = ""
assets = [
    ["target/release/hyprtilt", "usr/bin/", "755"],
    ["../../dist/assets/hyprtilt.1.gz", "usr/share/man/man1/", "644"],
    ["../../dist/assets/hyprtilt.bash", "usr/share/bash-completion/completions/hyprtilt", "644"],
    ["../../dist/assets/_hyprtilt", "usr/share/zsh/vendor-completions/", "644"],
    ["../../dist/assets/hyprtilt.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["../../README.md", "usr/share/doc/hyprtilt/", "644"],
]

# RPM package (cargo-generate-rpm), same content as the Debian package.
[package.metadata.generate-rpm]
summary = "TUI and CLI for Hyprland monitor layout that edits your config in place"
license = "GPL-3.0-only"
assets = [
    { source = "target/release/hyprtilt", dest = "/usr/bin/hyprtilt", mode = "755" },
    { source = "../../dist/assets/hyprtilt.1.gz", dest = "/usr/share/man/man1/hyprtilt.1.gz", mode = "644", doc = true },
    { source = "../../dist/assets/hyprtilt.bash", dest = "/usr/share/bash-completion/completions/hyprtilt", mode = "644" },
    { source = "../../dist/assets/_hyprtilt", dest = "/usr/share/zsh/site-functions/_hyprtilt", mode = "644" },
    { source = "../../dist/assets/hyprtilt.fish", dest = "/usr/share/fish/vendor_completions.d/hyprtilt.fish", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/hyprtilt/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/hyprtilt/README.md", mode = "644", doc = true },
]
