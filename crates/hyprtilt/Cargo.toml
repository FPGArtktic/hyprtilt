[package]
name = "hyprtilt"
description = "TUI and CLI for Hyprland monitor layout that edits your Lua or hyprlang config in place"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["hyprland", "monitor", "tui", "wayland"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
hyprtilt-core = { version = "0.1.0", path = "../hyprtilt-core" }
serde_json = "1.0.151"

[lints]
workspace = true
