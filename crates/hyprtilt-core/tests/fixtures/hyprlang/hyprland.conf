# Hyprland configuration (hyprlang).
$mainMod = SUPER
$laptop = eDP-1

monitor = HDMI-A-1, 2560x1440@144, 0x0, 1, transform, 1
monitor=eDP-1,1920x1080@144,1440x1335,1
monitor = DP-1, 2560x1440@179.95, 3360x975, 1, vrr, 2 # fast panel
monitor = $laptop, addreserved, 10, 0, 0, 0
monitor = , preferred, auto, 1

monitorv2 {
    output = desc:Samsung Electric Company Odyssey G50F SERIAL0002
    mode = 2560x1440@179.95
    position = 3360x975
    scale = 1
    sdr_eotf = gamma22
}

# A literal hash needs doubling: ## is one #.
exec-once = notify-send "hello ## world"
source = ~/.config/hypr/monitors.conf

general {
    gaps_in = 5
}

bind = $mainMod, Q, exec, kitty
