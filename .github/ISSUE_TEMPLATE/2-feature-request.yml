#
# GitHub issue form for feature requests.

name: Feature request
description: Suggest a new feature or a change to existing behaviour.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        hyprtilt is config-file-first: it edits your Hyprland configuration in
        place. A hotplug daemon, workspace planning and compositors other than
        Hyprland are out of scope for the 0.x releases.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should hyprtilt behave? Commands, keys or file formats.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you considered.
