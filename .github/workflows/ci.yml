#
# Continuous integration. The jobs run the same "just" targets as developers
# do locally (see CONTRIBUTING.md), inside the build image published by
# build-image.yml and pinned here by digest. Only the aarch64 job runs on the
# host: the Arch Linux image exists for x86_64 only.
#
# The image digest appears once per container job. Update all of them
# together when build-image.yml publishes a new image.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A pull request has one group, so a new push cancels the superseded run.
# Every push to main has a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: lint, test, docs, deny, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # publish the coverage badge to the badges branch
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /cache/cargo/registry
            /cache/cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Lint
        run: just lint

      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: API documentation
        run: just doc

      - name: Dependencies
        run: just deny

      - name: Coverage
        run: just cov

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # The badge lives on an orphan "badges" branch, so the README needs no
      # third-party service and the branch never appears in the history of
      # main. Pushes made with GITHUB_TOKEN start no workflow run.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          work="$(mktemp -d)"
          cp coverage-badge.json "$work/coverage.json"
          cd "$work"
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit --quiet -m "coverage of ${SHA}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" badges

      - name: Keep coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
          retention-days: 14

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check with the MSRV toolchain
        run: just msrv

  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The pull request head, not the merge commit GitHub creates.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check subjects and sign-offs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The job runs as root in the container, the checkout belongs to
          # the runner user, so git would refuse the repository otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just commits "$BASE"

  aarch64:
    name: test (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Test
        run: |
          cargo test --workspace --all-targets --locked
          cargo test --workspace --doc --locked

  docs:
    name: documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the site (warnings are errors)
        run: just docs

  offline:
    name: offline build from vendored sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vendor, then build with --offline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just offline

  packages:
    name: .deb and .rpm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build packages
        run: just pkg-deb pkg-rpm

      - name: Keep packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  install:
    name: install on ${{ matrix.name }}
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: docker.io/library/ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            kind: deb
            file: hyprtilt_*_amd64.deb
          - name: Ubuntu 24.04
            image: docker.io/library/ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
            kind: deb
            file: hyprtilt_*_amd64.deb
          - name: Debian bookworm
            image: docker.io/library/debian:bookworm@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
            kind: deb
            file: hyprtilt_*_amd64.deb
          - name: Fedora 43
            image: docker.io/library/fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
            kind: rpm
            file: hyprtilt-*.x86_64.rpm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Install and check
        env:
          KIND: ${{ matrix.kind }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # the pattern must expand
          bash scripts/test-package-install.sh "$KIND" "$(ls "$PWD"/dist/$FILE)"

  aur:
    name: AUR recipe ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [hyprtilt-git, hyprtilt]
    container:
      image: docker.io/library/archlinux:base-devel-20260920.0.596911@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      # actions/checkout needs git to produce a repository, which makepkg
      # clones.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: makepkg, namcap, install
        env:
          HYPRTILT_SRC: ${{ github.workspace }}
          PACKAGE: ${{ matrix.package }}
        run: bash scripts/test-aur-package.sh "$PACKAGE"
