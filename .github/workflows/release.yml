#
# Release. Pushing a signed tag v<version> is the manual gate: the tag is
# verified (scripts/verify-release-tag.sh), every check runs again, the
# artifacts are built in the build image, the checksums are signed keyless
# with cosign, and a GitHub release is created. crates.io and the AUR are
# published only when their secrets are configured (CARGO_REGISTRY_TOKEN,
# AUR_SSH_KEY with the variable AUR_HOST_KEY; scripts/publish-aur.sh).
#
# "Run workflow" (workflow_dispatch) is a dry run: it builds and checks
# everything and keeps the artifacts, and publishes nothing.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the history, the tag check the tag
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The checkout fetches tags as they are, so an annotated tag keeps its
      # signature.
      - name: Verify the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_TAG_KEYS: ${{ vars.RELEASE_TAG_KEYS }}
        run: scripts/verify-release-tag.sh "$TAG"

      - name: All checks
        run: just ci

      - name: Artifacts
        run: just dist

      - name: Release notes
        env:
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            git-cliff --latest --strip header --output dist/RELEASE_NOTES.md
          else
            git-cliff --unreleased --strip header --output dist/RELEASE_NOTES.md
          fi
          cat dist/RELEASE_NOTES.md

      - name: Keep artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.spdx.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          retention-days: 14

  publish:
    name: GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # cosign keyless signing with the GitHub OIDC token
    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          [[ "$TAG" == *-rc.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "hyprtilt ${TAG#v}" --notes-file dist/RELEASE_NOTES.md \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.spdx.json \
            dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle

  crates:
    name: crates.io
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out
        if: env.CARGO_REGISTRY_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the crates
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish --locked -p hyprtilt-core
          cargo publish --locked -p hyprtilt

      - name: Skipped
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set; crates.io was not published"

  aur:
    name: AUR
    needs: publish
    # Pre-releases stay off the AUR; hyprtilt there is the latest release.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/fpgartktic/hyprtilt-build@sha256:c479dd766fe1014d09fc522ff6bc8a451a5eb31f062069be7297676641b81587
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      AUR_HOST_KEY: ${{ vars.AUR_HOST_KEY }}
    steps:
      - name: Check out
        if: env.AUR_SSH_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the recipes are taken from the tag
          persist-credentials: false

      - name: Trust the checkout
        if: env.AUR_SSH_KEY != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Publish the recipes
        if: env.AUR_SSH_KEY != ''
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/publish-aur.sh "${TAG#v}"

      - name: Skipped
        if: env.AUR_SSH_KEY == ''
        run: echo "::notice::AUR_SSH_KEY is not set; the AUR was not published"
