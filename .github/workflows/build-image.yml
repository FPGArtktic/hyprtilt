#
# Build the build image (containers/build/Containerfile) and publish it to
# ghcr.io/fpgartktic/hyprtilt-build when its inputs change on main, or on
# demand. The other workflows pin the image by digest; the digest of every
# published image is printed as a notice annotation of this run, and the pin
# is updated in a separate commit.
name: build-image

on:
  push:
    branches:
      - main
    paths:
      - containers/build/**
      - rust-toolchain.toml
      - docs/requirements.txt
      - .dockerignore
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fpgartktic/hyprtilt-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/build/Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "::notice title=build image::${IMAGE}@${DIGEST}"
          echo "Published \`${IMAGE}@${DIGEST}\`" >>"$GITHUB_STEP_SUMMARY"
