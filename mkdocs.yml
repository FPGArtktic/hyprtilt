#
# Documentation site: MkDocs with Material for MkDocs, built by Read the Docs
# (.readthedocs.yaml) and locally with "just docs". Warnings are errors.

site_name: hyprtilt
site_description: >-
  Keyboard-first TUI and CLI for Hyprland monitor layout that edits your Lua
  or hyprlang configuration in place.
site_author: Mateusz Okulanis
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://hyprtilt.readthedocs.io/en/latest/"]
repo_url: https://github.com/FPGArtktic/hyprtilt
repo_name: FPGArtktic/hyprtilt
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 Mateusz Okulanis &middot; GPL-3.0-only &middot;
  Made in Poland

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    annotation: material/plus-circle
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FPGArtktic/hyprtilt
      name: hyprtilt on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Guide:
      - Installation: guide/installation.md
      - Quick start: guide/quick-start.md
      - Terminal interface: guide/tui.md
      - Command line: guide/cli.md
      - Configuration files: guide/configuration.md
      - Applying and rollback: guide/apply.md
      - Profiles: guide/profiles.md
      - Troubleshooting: guide/doctor.md
  - Design:
      - Architecture (ADR 0001): adr/0001-architecture.md
      - Hyprland API notes: hyprland-lua-api.md
  - Project:
      - Roadmap: project/roadmap.md
      - Changelog: project/changelog.md
      - Contributing: project/contributing.md
