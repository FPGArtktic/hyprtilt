#
# The pinned toolchain used by the build container and CI. The MSRV is
# rust-version in Cargo.toml and is checked by a separate CI job.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
profile = "minimal"
